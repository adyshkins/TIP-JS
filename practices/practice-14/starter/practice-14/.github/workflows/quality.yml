name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tip_tasks_test
          POSTGRES_USER: tip_app
          POSTGRES_PASSWORD: tip_password
        options: >-
          --health-cmd "pg_isready -U tip_app -d tip_tasks_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://tip_app:tip_password@127.0.0.1:5432/tip_tasks_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: docker build --tag tip-pr14:${{ github.sha }} .
